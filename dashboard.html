<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweet Bookmarks</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">📌 Tweet Bookmarks</h1>
      </div>
      <div class="header-center">
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="Search bookmarks...">
          <button id="clear-search" class="clear-search" style="display: none;">&times;</button>
        </div>
      </div>
      <div class="header-right">
        <button id="export-btn" class="btn btn-secondary">Export</button>
        <label class="btn btn-secondary">
          Import
          <input type="file" id="import-input" accept=".json" style="display: none;">
        </label>
      </div>
    </header>

    <div class="main-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-section">
          <h3 class="sidebar-title">Filter by Tags</h3>
          <div id="tag-list" class="tag-list">
            <!-- Tags will be populated here -->
          </div>
          <button id="clear-filter" class="clear-filter" style="display: none;">Clear Filter</button>
        </div>
        <div class="sidebar-section">
          <div class="stats">
            <div class="stat-item">
              <span class="stat-value" id="total-count">0</span>
              <span class="stat-label">Total Bookmarks</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <div id="bookmarks-container" class="bookmarks-grid">
          <!-- Bookmarks will be populated here -->
        </div>
        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon">📭</div>
          <h2>No bookmarks yet</h2>
          <p>Save tweets from X/Twitter using the 📌 button</p>
        </div>
        <div id="no-results" class="empty-state" style="display: none;">
          <div class="empty-icon">🔍</div>
          <h2>No results found</h2>
          <p>Try a different search term</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Edit Bookmark</h2>
        <button class="modal-close" id="edit-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Tags</label>
          <input type="text" id="edit-tags" class="form-input" placeholder="tech, ai, interesting">
          <p class="form-hint">Separate tags with commas</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
        <button class="btn btn-primary" id="edit-save">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay" style="display: none;">
    <div class="modal modal-small">
      <div class="modal-header">
        <h2 class="modal-title">Delete Bookmark?</h2>
        <button class="modal-close" id="delete-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p>This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
        <button class="btn btn-danger" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
