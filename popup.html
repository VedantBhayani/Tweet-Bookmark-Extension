<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet Bookmarks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #16181c;
            color: #e7e9ea;
            width: 280px;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
        }

        .stats {
            background: #000;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1d9bf0;
        }

        .stat-label {
            font-size: 13px;
            color: #71767b;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #1d9bf0;
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background: #1a8cd8;
        }

        .btn-secondary {
            background: transparent;
            color: #e7e9ea;
            border: 1px solid #536471;
        }

        .btn-secondary:hover {
            background: rgba(239, 243, 244, 0.1);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #71767b;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">📌</div>
        <div class="title">Tweet Bookmarks</div>
    </div>

    <div class="stats">
        <div class="stat-value" id="bookmark-count">0</div>
        <div class="stat-label">Saved Tweets</div>
    </div>

    <button class="btn btn-primary" id="open-dashboard">Open Dashboard</button>
    <button class="btn btn-secondary" id="export-btn">Export Bookmarks</button>

    <div class="footer">
        Save tweets with 📌 on X/Twitter
    </div>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
</body>

</html>
