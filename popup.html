<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet Bookmarks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 100%);
            color: #e7e9ea;
            width: 320px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(99, 102, 241, 0.1), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.08), transparent 40%);
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .title {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .stats {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a855f7);
            border-radius: 20px 20px 0 0;
        }

        .stat-value {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            color: #71767b;
            font-weight: 500;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: #e7e9ea;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .btn-icon {
            margin-right: 8px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shortcut {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            font-size: 10px;
            color: #71767b;
            margin-left: 4px;
        }

        .version {
            margin-top: 8px;
            font-size: 11px;
            color: #4b5563;
        }
    </style>
</head>

<body>
    <div class="header">
        <span class="logo-icon">📌</span>
        <div class="title">Tweet Bookmarks</div>
    </div>

    <div class="stats">
        <div class="stat-value" id="bookmark-count">0</div>
        <div class="stat-label">Saved Tweets</div>
    </div>

    <button class="btn btn-primary" id="open-dashboard">
        <span class="btn-icon">🚀</span>Open Dashboard
    </button>
    <button class="btn btn-secondary" id="export-btn">
        <span class="btn-icon">📤</span>Export All
    </button>

    <div class="footer">
        Save tweets with 📌 on X/Twitter
        <div class="version">v1.1.0 • Premium Edition</div>
    </div>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
</body>

</html>
