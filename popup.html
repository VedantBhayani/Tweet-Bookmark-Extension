<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet Bookmarks</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <span class="logo-icon" aria-hidden="true">📌</span>
        <div class="title">Tweet <span class="title-accent">Bookmarks</span></div>
    </div>

    <div class="stats">
        <div class="stat-value" id="bookmark-count" aria-live="polite">0</div>
        <div class="stat-label">Saved Tweets</div>
    </div>

    <button class="btn btn-primary" id="open-dashboard" aria-label="Open bookmarks dashboard">
        <span class="btn-icon" aria-hidden="true">→</span>Open Dashboard
    </button>
    <button class="btn btn-secondary" id="export-btn" aria-label="Export all bookmarks as JSON file">
        <span class="btn-icon" aria-hidden="true">↓</span>Export All
    </button>

    <div class="footer">
        Save tweets with 📌 on X
        <div class="version">v1.1.0</div>
    </div>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
</body>

</html>
